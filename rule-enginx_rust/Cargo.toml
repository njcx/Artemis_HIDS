[package]
name = "rule-enginx"
version = "0.1.0"
edition = "2021"

[dependencies]
# Kafka 客户端
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }
# 异步运行时
tokio = { version = "1.43", features = ["full"] }
tokio-util = "0.7"
# 高性能 MPMC channel
flume = "0.11"
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# 日志
log = "0.4"
env_logger = "0.11"
# 正则表达式
regex = "1.11"
# 时间处理
chrono = { version = "0.4", features = ["serde"] }
# 表达式求值
evalexpr = "13.0"
# 错误处理
anyhow = "1.0"
thiserror = "2.0"
# 命令行参数
clap = { version = "4.5", features = ["derive"] }
# 配置管理
config = "0.14"
# 集合工具
dashmap = "6.1"
# UUID 生成
uuid = { version = "1.11", features = ["v4"] }
# 异步 trait
async-trait = "0.1"
# MongoDB 客户端
mongodb = { version = "3.8", default-features = false, features = ["bson-2", "compat-3-3-0", "rustls-tls", "dns-resolver"] }
bson = { version = "2.13", features = ["chrono-0_4"] }
futures-util = "0.3"
# 无锁原子替换（规则热更新）
arc-swap = "1.7"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
