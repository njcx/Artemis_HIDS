syntax = "proto3";

package hids;

import "struct.proto";

option go_package = "artemis_agent/pb";

// 监控数据服务
service MonitorService {
  // 批量上报监控数据
  rpc SendBatch(BatchRequest) returns (BatchResponse);
  
  // 发送心跳 (返回待执行的命令)
  rpc SendHeartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  
  // Agent 上报命令执行结果
  rpc ReportCommandResult(CommandResult) returns (CommandResultAck);
}

// 批量数据请求
message BatchRequest {
  string agent_id = 1;
  string hostname = 2;
  repeated MonitorEvent events = 3;
}

// 批量数据响应
message BatchResponse {
  bool success = 1;
  string message = 2;
  int32 accepted_count = 3;
}

// 监控事件
message MonitorEvent {
  string worker_name = 1;   // worker名称: file_monitor, process_monitor, network_monitor
  int64 timestamp = 2;      // Unix时间戳（纳秒）
  string event_type = 3;    // 事件类型
  google.protobuf.Struct data = 4;  // 事件数据（支持嵌套结构）
}

// 心跳请求
message HeartbeatRequest {
  string agent_id = 1;
  string hostname = 2;
  int64 timestamp = 3;
  google.protobuf.Struct status = 4;  // 状态信息（支持复杂数据结构）
}

// 心跳响应
message HeartbeatResponse {
  bool success = 1;
  string message = 2;
  repeated Command commands = 3;  // 待执行的命令
}

// 配置命令
message Command {
  string command_id = 1;
  string command_type = 2;  // stop_worker, start_worker, update_agent, update_worker, set_config
  map<string, string> payload = 3;
  int64 timestamp = 4;
}

// 命令执行结果
message CommandResult {
  string agent_id = 1;
  string command_id = 2;
  bool success = 3;
  string message = 4;
  int64 timestamp = 5;
}

// 命令结果确认
message CommandResultAck {
  bool received = 1;
}
