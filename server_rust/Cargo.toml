[package]
name = "hids-server"
version = "0.1.0"
edition = "2024"

[dependencies]
# gRPC 服务
tonic = { version = "0.12", features = ["tls"] }
prost = "0.13"
prost-types = "0.13"
# 异步运行时
tokio = { version = "1.43", features = ["full"] }
tokio-stream = "0.1"
# Kafka 客户端
rdkafka = { version = "0.36", features = ["cmake-build", "ssl", "sasl"] }
# Redis 客户端
redis = { version = "0.27", features = ["tokio-comp", "connection-manager"] }
# 序列化
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
# 日志
log = "0.4"
env_logger = "0.11"
# 错误处理
anyhow = "1.0"
thiserror = "2.0"
# 命令行参数
clap = { version = "4.5", features = ["derive"] }
# 时间处理
chrono = "0.4"
# 并发工具
dashmap = "6.1"
# UUID
uuid = { version = "1.11", features = ["v4"] }
# TLS 支持
tokio-rustls = "0.26"
rustls-pemfile = "2.2"
rustls = { version = "0.23", features = ["ring"] }

[build-dependencies]
tonic-build = "0.12"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true